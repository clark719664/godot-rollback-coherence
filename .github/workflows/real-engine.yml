name: Real-engine controls and two-peer gameplay rollback
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify pinned dependencies
        shell: pwsh
        run: ./prepare.ps1
      - name: Original Rapier reduced controls
        shell: pwsh
        run: ./run.ps1 -Version original
      - name: Original Rapier full two-peer gameplay suite
        shell: pwsh
        run: ./run-full.ps1 -Version original
      - name: Current Rapier reduced controls
        shell: pwsh
        run: ./run.ps1 -Version latest
      - name: Current Rapier full two-peer gameplay suite
        shell: pwsh
        run: ./run-full.ps1 -Version latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-engine-logs
          include-hidden-files: true
          path: |
            .runs/**/*.log
            .runs/**/summary.json
            .runs/**/server.json
            .runs/**/client.json
            .runs/**/results.json
